<!DOCTYPE html>
<html><head><title>OpenClaw AI</title>
<style>
body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.container{text-align:center;padding:2rem}
h1{font-size:4rem;margin-bottom:1rem}
.pulse{display:inline-block;width:12px;height:12px;background:#0f0;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:2rem;border-radius:20px;margin:2rem 0}
</style></head><body>
<div class="container">
<h1>🤖 OpenClaw</h1>
<p style="font-size:1.5rem;margin-bottom:2rem">Autonomous AI Business OS</p>
<div class="status">
<h2>System Status</h2>
<p><span class="pulse"></span> Online & Operational</p>
</div>
<p style="opacity:.7">Powered by ShieldTech Security</p>
</div></body></html>
